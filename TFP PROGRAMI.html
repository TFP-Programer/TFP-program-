<style>
:root{--bg:#020a04;--fg:#33ff66;--dim:#1c9b3d;--err:#ff5555;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--fg);font:15px/1.45 "Courier New",monospace;display:flex;flex-direction:column;text-shadow:0 0 6px #33ff6666}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0003 0 1px,transparent 1px 3px)}
#out{flex:1;overflow-y:auto;padding:14px;white-space:pre-wrap;word-break:break-word}
.d{color:var(--dim)}.e{color:var(--err)}.s{color:#ffd24d}
#row{display:flex;padding:8px 14px;border-top:1px solid var(--dim)}
#pr{white-space:pre}
#in{flex:1;background:none;border:0;outline:0;color:var(--fg);font:inherit;text-shadow:inherit;min-width:0}
#ring{display:inline-block;vertical-align:middle}
#cui{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cui.on{display:flex}
#ch,#cf{display:flex;align-items:center;gap:8px;padding:8px 12px}
#ch{border-bottom:1px solid var(--dim)}#cf{border-top:1px solid var(--dim)}
#ct{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#ffd24d}
.btn{background:none;border:1px solid var(--dim);color:var(--fg);font:inherit;font-size:14px;padding:5px 10px;cursor:pointer;text-shadow:inherit}
.btn:hover,.btn:active{background:#33ff6633}
#cb{flex:1;display:flex;min-height:0;position:relative}
#msgs{flex:1;overflow-y:auto;padding:12px;min-width:0}
.m{margin:3px 0;word-break:break-word}.m b{color:#ffd24d}.m.me b{color:#7dffb0}
#side{width:240px;border-left:1px solid var(--dim);overflow-y:auto;padding:10px;flex-shrink:0;font-size:14px}

.u{display:flex;align-items:center;gap:8px;padding:3px 0}.u .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}

#toast.on{opacity:1;transform:none}

<div id="cui"><div id="ch"><span id="ct"></span><button class="btn" id="bm">👥 <span id="bn">0</span></button><button class="btn" id="bx">çık</button></div><div id="cb"><div id="msgs"></div><div id="side"></div></div><div id="cf"><input id="ci" placeholder="mesaj yaz..." autocomplete="off" enterkeyhint="send"><button class="btn" id="bs">gönder</button></div></div>
<div id="cm"></div><div id="pm"><div id="pb"></div></div>
<div id="toast">ⓘ bir adım geri dönmek için “back” yaz</div>
<div id="row"><span id="pr">&gt; </span><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
<script>
const out=document.getElementById('out'),inp=document.getElementById('in'),pr=document.getElementById('pr');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mem={},LOC=['tfp_me','tfp_inst'],COLL=['tfp_rooms','tfp_inv','tfp_freq'];
let DB=null;const K={};
const dk=k=>k.replace(/[^\w.:@+~-]/g,'_');
const lget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}};
const lset=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function dput(k,v){const i=dk(k);K[i]=v;if(DB)DB.doc('kv/'+i).set({v:JSON.stringify(v)}).catch(()=>{})}
function ddel(k){const i=dk(k);delete K[i];if(DB)DB.doc('kv/'+i).delete().catch(()=>{})}
const items=p=>Object.keys(K).filter(i=>i.startsWith(p+':')).map(i=>K[i]);
function pushMsg(id,m){const ts=m.ts||Date.now(),key='tfp_msg_'+id+':'+ts+'-'+Math.random().toString(36).slice(2,6);dput(key,{...m,ts,k:key})}
function mkRoom(r){const a=items('tfp_msg_'+r.id).sort((x,y)=>x.ts-y.ts||(x.k<y.k?-1:1));a.push=m=>{pushMsg(r.id,m);return 0};return {...r,msgs:a}}
const byId=(x,y)=>x.id<y.id?-1:1;
const L=(k,d)=>{
  if(LOC.includes(k))return lget(k,d);
  if(k==='tfp_rooms')return items(k).sort(byId).map(mkRoom);
  if(COLL.includes(k))return items(k).sort(byId);
  const i=dk(k);return i in K?K[i]:d};
const S=(k,v)=>{
  if(LOC.includes(k))return lset(k,v);
  if(COLL.includes(k)){
    const strip=x=>{if(k!=='tfp_rooms')return x;const {msgs,...r}=x;return r};
    const old={};L(k,[]).forEach(x=>old[x.id]=strip(x));const seen={};
    v.forEach(x=>{seen[x.id]=1;const n=strip(x);if(!old[x.id]||JSON.stringify(n)!==JSON.stringify(old[x.id]))dput(k+':'+x.id,n)});
    Object.keys(old).forEach(id=>{if(!seen[id]){ddel(k+':'+id);if(k==='tfp_rooms')items('tfp_msg_'+id).forEach(m=>ddel(m.k))}});
    return}
  dput(k,v)};
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('tfp:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function initDB(){
  try{const c=window.claude&&await window.claude.use('db');if(!c)return false;
    const u=await window.claude.use('user');window.RO=u?(await u.can('data.write'))===false:false;
    DB=c;
    await new Promise(res=>{let first=true;
      c.collection('kv').onSnapshot(snap=>{
        for(const ch of snap.docChanges()){const id=ch.doc.id;
          if(ch.type==='removed')delete K[id];
          else{try{K[id]=JSON.parse(ch.doc.data().v)}catch(e){}}}
        if(first){first=false;res()}},
        e=>{DB=null;if(first){first=false;res()}})});
    return !!DB}catch(e){return false}}
function P(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.className=c;out.appendChild(d);out.scrollTop=out.scrollHeight;return d}
async function type(lines,ms=25){for(const l of lines){await sleep(ms*3);P(l)}}
let resolver=null,secret=false;
function ask(label,sec){return new Promise(r=>{pr.textContent=label+' ';inp.type=sec?'password':'text';secret=sec;resolver=r;inp.focus()})}
inp.addEventListener('keydown',e=>{if(e.key!=='Enter'||!resolver)return;const v=inp.value.trim();inp.value='';P(pr.textContent+(secret?'*'.repeat(v.length):v),'d');const r=resolver;resolver=null;r(v)});
document.addEventListener('click',()=>{if(!document.getElementById('cui').classList.contains('on'))inp.focus()});
const toast=on=>document.getElementById('toast').classList.toggle('on',on);
const isB=v=>String(v).toLowerCase()==='back';
const BOOT=['TFP-OS v1.0 başlatılıyor...','bellek testi ........ OK','ağ arayüzü ........ OK','şifreleme modülü .. OK','bölge sunucuları .. ARMEL / ORGB / FNT'];

async function ring(sec,mm){
  const d=P('');d.innerHTML='<svg id="ring" width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="none" stroke="#1c9b3d55" stroke-width="5"/><circle id="arc" cx="32" cy="32" r="26" fill="none" stroke="#33ff66" stroke-width="5" stroke-dasharray="163.4" stroke-dashoffset="163.4" transform="rotate(-90 32 32)"/></svg> <span id="pct">0%</span> <span id="msg"></span>';
  const arc=d.querySelector('#arc'),pct=d.querySelector('#pct'),msg=d.querySelector('#msg');
  const m=mm||['veriler işleniyor...','paketler çözülüyor...','TFP PROGRAMI indiriliyor...','ek dosyalar kuruluyor...','kayıt defteri yazılıyor...','bağlantılar doğrulanıyor...'];
  const t0=Date.now();let p=0,i=0;
  while(p<1){p=Math.min(1,(Date.now()-t0)/(sec*1000));arc.setAttribute('stroke-dashoffset',163.4*(1-p));pct.textContent=Math.floor(p*100)+'%';
    const k=Math.min(m.length-1,Math.floor(p*m.length));if(k!==i||!msg.textContent){i=k;msg.textContent=m[k]}await sleep(100)}
}

async function setup(){
  const fresh=!L('tfp_inst',0);
  if(fresh){await type(BOOT);P('');await type(['KURULUM MODU: ilk çalıştırma algılandı.',''])}else P('── YENİ HESAP OLUŞTURMA ──','s');
  const users=L('tfp_users',[]);let name,pw,st=0;
  toast(true);
  while(st<3){
    if(st===0){const v=await ask('kullanıcı adı seç:');if(isB(v)){if(!fresh){toast(false);return null}continue}if(!/^[\w.-]{3,16}$/.test(v))P('3-16 karakter (harf, rakam, . _ -)','e');else if(L('tfp_acc_'+v,null))P('bu ad alınmış','e');else{name=v;st=1;P('kullanıcı adı kaydedildi. akış devam ediyor...','d')}}
    else if(st===1){const v=await ask('şifre belirle:',true);if(isB(v)){st=0;continue}if(v.length<4)P('en az 4 karakter','e');else{pw=v;st=2}}
    else{const v=await ask('şifreyi doğrula:',true);if(isB(v)){st=1;continue}if(v===pw)st=3;else P('şifreler eşleşmiyor','e')}
  }
  toast(false);
  await type(['şifre doğrulandı.',fresh?'kurulum başlıyor...':'hesap oluşturuluyor...']);
  if(fresh)await ring(15+Math.random()*30);else await ring(2,['hesap kaydediliyor...']);
  S('tfp_acc_'+name,await sha(name+':'+pw));S('tfp_inst',1);created(name);S('tfp_me',{name});
  P('');await type(fresh?['KURULUM TAMAMLANDI.','TFP PROGRAMI bu cihaza kuruldu.','']:['HESAP OLUŞTURULDU: '+name,'']);
  return {name,pw};
}
async function login(me){
  await type(BOOT,12);P('');
  await type(['kimlik tanındı: '+me.name,'oturum açılıyor ▓▓▓▓▓▓▓▓▓▓ 100%','']);
}

function created(n){let c=L('tfp_prof_'+n,0);if(!c){c=Date.now();S('tfp_prof_'+n,c)}return c}
function fmtAge(c,n){const a=new Date(c),b=new Date(n);let y=b.getFullYear()-a.getFullYear(),mo=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate(),h=b.getHours()-a.getHours(),mi=b.getMinutes()-a.getMinutes(),s=b.getSeconds()-a.getSeconds(),ms=b.getMilliseconds()-a.getMilliseconds();
  if(ms<0){ms+=1000;s--}if(s<0){s+=60;mi--}if(mi<0){mi+=60;h--}if(h<0){h+=24;d--}if(d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();mo--}if(mo<0){mo+=12;y--}
  return y+' yıl '+mo+' ay '+d+' gün '+h+' sa '+mi+' dk '+s+' sn '+String(ms).padStart(3,'0')+' ms'}
function sendReq(to){
  if(L('tfp_fr_'+me.name,[]).includes(to))return 'zaten arkadaşsınız';
  const q=L('tfp_freq',[]);
  if(q.some(x=>x.from===me.name&&x.to===to))return 'istek zaten gönderilmiş';
  q.push({id:Date.now()+'',from:me.name,to});S('tfp_freq',q);return '✓ arkadaşlık isteği gönderildi';
}
document.addEventListener('click',()=>{if(Date.now()-(window._cmt||0)>400)document.getElementById('cm').classList.remove('on')});
const R=()=>L('tfp_rooms',[]);
const saveR=r=>S('tfp_rooms',r);
const REG={1:'ARMEL',2:'ORGB',3:'FNT'};
let me;

async function gate(){
  P('');P('TFP PROGRAMI — oturum açık değil','s');
  for(;;){
    P('1) giriş yap   2) yeni hesap oluştur');
    const c=await ask('seçim:');
    if(c==='1'){const r=await signin();if(r)return r}
    else if(c==='2'){const r=await setup();if(r)return r}
  }
}
async function signin(){
  toast(true);
  for(;;){
    const n=await ask('kullanıcı adı:');if(isB(n)){toast(false);return null}
    const p=await ask('şifre:',true);if(isB(p))continue;
    const h=L('tfp_acc_'+n,null);if(h&&h===await sha(n+':'+p)){toast(false);const u={name:n};S('tfp_me',u);await login(u);return u}
    P('✗ kullanıcı adı veya şifre hatalı','e');
  }
}
async function main(){
  me=L('tfp_me',null);
  if(me&&!L('tfp_acc_'+me.name,null)){S('tfp_me',null);me=null}
  if(!me)me=L('tfp_inst',0)?await gate():await setup();else await login(me);
  for(;;){
    const mine=R().filter(r=>r.perm&&(r.owner===me.name||(r.members||[]).includes(me.name)));
    const inv=L('tfp_inv',[]).filter(i=>i.to===me.name);
    toast(false);
    P('══════ TFP PROGRAMI ══════ ['+me.name+']','s');
    P('1) oda kur   2) odaya katıl   3) kayıtlı odalar ('+mine.length+')');
    P('4) arkadaşlar   5) davet/istekler ('+(inv.length+L('tfp_freq',[]).filter(x=>x.to===me.name).length)+')   0) hesaptan çık');
    const c=await ask('seçim:');
    if(c==='1')await create();else if(c==='2')await join();else if(c==='3')await saved(mine);
    else if(c==='4')await friends();else if(c==='5')await invites(inv);
    else if(c==='0'){S('tfp_me',null);P('hesaptan çıkış yapıldı: '+me.name,'d');me=await gate();}
  }
}
async function create(){
  const rooms=R();const f={};let st=0;
  toast(true);
  while(st<6){
    if(st===0){const v=await ask('oda adı:');if(isB(v)||!v)return;if(rooms.some(r=>r.name.toLowerCase()===v.toLowerCase()))P('bu oda adı kullanımda','e');else{f.name=v;st=1}}
    else if(st===1){const v=await ask('oda şifresi (boş = şifresiz):',true);if(isB(v)){st=0;continue}f.pw=v;st=2;P('bölge: 1) ARMEL 2) ORGB 3) FNT  — odalar bölgelere dağılır, yük azalır','d')}
    else if(st===2){const v=await ask('bölge:');if(isB(v)){st=1;continue}if(REG[v]){f.rg=v;st=3}else P('1, 2 veya 3 gir','e')}
    else if(st===3){const v=await ask('gizli oda? (e/h):');if(isB(v)){st=2;continue}if(/^[eh]$/i.test(v)){f.hidden=v.toLowerCase()==='e';st=4}else P('e veya h gir','e')}
    else if(st===4){const v=await ask('maksimum kişi sayısı (2-50):');if(isB(v)){st=3;continue}const m=parseInt(v,10);f.max=m>=2?Math.min(50,m):10;st=5}
    else{const v=await ask('1) geçici  2) kalıcı :');if(isB(v)){st=4;continue}if(v==='1'||v==='2'){f.perm=v==='2';st=6}else P('1 veya 2 gir','e')}
  }
  const room={id:Date.now()+''+Math.random().toString(36).slice(2,5),name:f.name,pw:f.pw,region:REG[f.rg],hidden:f.hidden,max:f.max,perm:f.perm,owner:me.name,members:[me.name],msgs:[]};
  rooms.push(room);saveR(rooms);
  P('oda kuruldu ['+room.region+'] '+(room.perm?'kalıcı':'geçici'),'s');await chat(room.id);
}
async function join(){
  toast(true);
  const pub=R().filter(r=>!r.pw&&!r.hidden);
  P('— açık odalar —','s');
  if(!pub.length)P('(şu an açık oda yok)','d');
  pub.forEach((r,i)=>P((i+1)+') '+r.name+' ['+r.region+'] '+r.members.length+'/'+r.max));
  const v=await ask('oda adı:');if(!v||isB(v))return;
  const room=/^\d+$/.test(v)&&pub[v-1]?pub[v-1]:R().find(r=>r.name===v);
  await ring(2+Math.random()*2.5,['oda aranıyor...']);
  if(!room){P('✗ oda bulunamadı','e');return}
  P('✓ oda bulundu: '+room.name,'s');
  await enter(room);
}
async function enter(room,skipPw){
  if(room.owner!==me.name&&!skipPw){
    if(room.pw){P('bu oda şifreli','d');const p=await ask('oda şifresi:',true);if(isB(p))return;if(p!==room.pw){P('yanlış şifre','e');return}}
    else P('bu oda şifresiz, devam ediliyor...','d');
    P('bölge: 1) ARMEL 2) ORGB 3) FNT','d');
    const g=await ask('bölge:');if(isB(g))return;
    if(REG[g]!==room.region){P('✗ oda bu bölgede değil','e');return}
  }
  await chat(room.id);
}
async function saved(list){
  toast(true);
  if(!list.length){P('kayıtlı oda yok','d');return}
  list.forEach((r,i)=>P((i+1)+') '+r.name+' ['+r.region+']'+(r.owner===me.name?' (sahibi)':'')));
  const v=await ask('numara (boş = geri):');if(!list[v-1])return;
  await enter(list[v-1]);
}
async function friends(){
  toast(true);
  const fr=L('tfp_fr_'+me.name,[]);
  P('arkadaşlar: '+(fr.join(', ')||'(yok)'),'s');
  const v=await ask('eklemek için kullanıcı adı:');if(!v||isB(v))return;
  if(v===me.name)P('kendini ekleyemezsin','e');
  else if(!L('tfp_acc_'+v,null))P('böyle bir kullanıcı yok','e');
  else if(fr.includes(v))P('zaten arkadaşsınız','d');
  else P(sendReq(v)+' → '+v,'s');
}
async function invites(){
  toast(true);
  for(;;){
    const fq=L('tfp_freq',[]).filter(x=>x.to===me.name);
    const rq=L('tfp_inv',[]).filter(x=>x.to===me.name);
    if(!fq.length&&!rq.length){P('bekleyen istek veya davet yok','d');return}
    const all=[...fq.map(x=>({k:'f',x})),...rq.map(x=>({k:'r',x}))];
    all.forEach((a,i)=>P((i+1)+') '+(a.k==='f'?a.x.from+' arkadaşlık isteği gönderdi':a.x.from+' seni "'+a.x.roomName+'" odasına davet etti')));
    const v=await ask('kabul: numara   reddet: r numara (boş = geri):');
    if(!v||isB(v))return;
    const rej=/^r/i.test(v);const a=all[parseInt(v.replace(/\D/g,''),10)-1];
    if(!a){P('geçersiz seçim','e');continue}
    if(a.k==='f'){
      S('tfp_freq',L('tfp_freq',[]).filter(z=>z.id!==a.x.id));
      if(rej)P('istek reddedildi','d');
      else{for(const [u,w] of [[me.name,a.x.from],[a.x.from,me.name]]){const l=L('tfp_fr_'+u,[]);if(!l.includes(w)){l.push(w);S('tfp_fr_'+u,l)}}
        P('✓ '+a.x.from+' ile arkadaş oldunuz','s')}
    }else{
      S('tfp_inv',L('tfp_inv',[]).filter(z=>z.id!==a.x.id));
      if(rej){P('davet reddedildi','d');continue}
      const room=R().find(r=>r.id===a.x.room);if(!room){P('oda artık yok','e');continue}
      await enter(room,true);return;
    }
  }
}
function chat(id){
  toast(false);
  return new Promise(done=>{
    let room=R().find(r=>r.id===id);if(!room)return done();
    const bn=(room.bans||{})[me.name];
    if(bn&&(bn===-1||bn>Date.now())){P('✗ bu odadan yasaklısın: '+(bn===-1?'süresiz':Math.ceil((bn-Date.now())/60000)+' dk kaldı'),'e');return done()}
    if(!room.members.includes(me.name)){
      if(room.members.length>=room.max){P('oda dolu ('+room.max+')','e');return done()}
      room.members.push(me.name);room.msgs.push({s:1,t:me.name+' katıldı',ts:Date.now()});upd(room)}
    const $=i=>document.getElementById(i),cui=$('cui'),msgs=$('msgs'),side=$('side'),ci=$('ci');
    const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
    const hbk=u=>'tfp_p_'+id+'_'+u;
    let shown=0,iv,armed=null,last='';window._hb=0;
    msgs.innerHTML='';side.classList.remove('open');cui.classList.add('on');ci.value='';
    const fin=cleanup=>{
      clearInterval(iv);cui.classList.remove('on');ddel(hbk(me.name));
      if(cleanup){const r=R().find(x=>x.id===id);
        if(r&&r.members.includes(me.name)){
          if(r.owner===me.name&&!r.perm){saveR(R().filter(x=>x.id!==id));P('geçici oda sahibi çıktı, oda silindi','d')}
          else{r.members=r.members.filter(x=>x!==me.name);
            if(!r.perm&&!r.members.length){saveR(R().filter(x=>x.id!==id));P('oda boşaldı, geçici olduğu için silindi','d')}
            else{r.msgs.push({s:1,t:me.name+' ayrıldı',ts:Date.now()});upd(r)}}}}
      P('odadan çıkıldı.','d');done()};
    const addMsg=m=>{const d=el('div','m'+(m.s?' d':'')+(m.u===me.name?' me':''));
      if(m.s)d.textContent='* '+m.t;
      else{const tm=new Date(m.ts||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
        d.append('['+tm+'] ',bind(el('b',0,m.u),m.u),': '+m.t)}
      msgs.appendChild(d)};
    const kick=u=>{const r=R().find(x=>x.id===id);if(!r)return;r.members=r.members.filter(x=>x!==u);r.msgs.push({s:1,t:u+' odadan çıkarıldı',ts:Date.now()});upd(r);poll()};
    const invite=(u,r)=>{S('tfp_inv',[...L('tfp_inv',[]),{id:Date.now()+'',from:me.name,to:u,room:id,roomName:r.name}]);addMsg({s:1,t:u+' davet edildi'});msgs.scrollTop=msgs.scrollHeight};
    const arm=()=>{if(armed==='close'){saveR(R().filter(x=>x.id!==id));P('oda kapatıldı.','d');fin(false)}
      else{armed='close';last='';poll();setTimeout(()=>{armed=null;last='';poll()},3000)}};
    const cm=$('cm');let lp;
    const bind=(e,u)=>{e.classList.add('nm');
      e.oncontextmenu=ev=>{ev.preventDefault();ev.stopPropagation();showCm(ev.clientX,ev.clientY,u)};
      e.ontouchstart=ev=>{const t=ev.touches[0];lp=setTimeout(()=>showCm(t.clientX,t.clientY,u),500)};
      e.ontouchend=e.ontouchmove=()=>clearTimeout(lp);return e};
    const ban=(u,m)=>{const r=R().find(x=>x.id===id);if(!r)return;
      r.bans=r.bans||{};r.bans[u]=m?Date.now()+m*60000:-1;
      r.members=r.members.filter(x=>x!==u);
      r.msgs.push({s:1,t:u+' odadan banlandı ('+(m?m+' dk':'sınırsız')+')',ts:Date.now()});upd(r);poll()};
    const profile=u=>{
      const pm=$('pm'),box=$('pb');box.innerHTML='';pm.classList.add('on');
      const r0=R().find(x=>x.id===id)||room;let pi;
      const close=()=>{clearInterval(pi);pm.classList.remove('on')};
      box.appendChild(el('h3',0,'👤 '+u+(u===r0.owner?'  ♛ oda sahibi':'')));
      box.appendChild(el('div','d','hesap süresi'));
      const age=el('div','age');box.appendChild(age);
      const c=created(u);const tick=()=>{age.textContent=fmtAge(c,Date.now())};tick();pi=setInterval(tick,37);
      if(u!==me.name){
        const isF=L('tfp_fr_'+me.name,[]).includes(u);
        const fb=el('button','btn',isF?'✓ arkadaşsınız':'+ arkadaşlık isteği gönder');
        if(isF)fb.disabled=true;else fb.onclick=()=>{fb.textContent=sendReq(u);fb.disabled=true};
        box.appendChild(fb);
        const mine=R().filter(x=>x.owner===me.name&&!x.members.includes(u));
        if(mine.length){box.appendChild(el('div','d','hızlı davet (odalarım):'));
          mine.forEach(x=>{const b=el('button','btn','→ '+x.name);
            b.onclick=()=>{S('tfp_inv',[...L('tfp_inv',[]),{id:Date.now()+'',from:me.name,to:u,room:x.id,roomName:x.name}]);b.textContent='✓ davet edildi';b.disabled=true};
            box.appendChild(b)})}
      }
      const cb=el('button','btn','kapat');cb.onclick=close;box.appendChild(cb);
      pm.onclick=e=>{if(e.target===pm)close()}};
    const showCm=(x,y,u)=>{
      const r=R().find(z=>z.id===id)||room,own=r.owner===me.name;
      cm.innerHTML='';window._cmt=Date.now();
      const it=(t,f,c)=>{const b=el('div','mi'+(c?' '+c:''),t);b.onclick=()=>{cm.classList.remove('on');f()};cm.appendChild(b)};
      cm.appendChild(el('div','mh',u));
      if(own&&u!==me.name){
        it('kullanıcıyı odadan çıkar',()=>kick(u));
        [['15 dk banla',15],['30 dk banla',30],['sınırsız banla',0]].forEach(([t,m])=>it(t,()=>ban(u,m),'dg'));
      }
      it('profile göz at',()=>profile(u));
      cm.classList.add('on');
      cm.style.left=Math.max(4,Math.min(x,innerWidth-cm.offsetWidth-4))+'px';
      cm.style.top=Math.max(4,Math.min(y,innerHeight-cm.offsetHeight-4))+'px'};
    const drawSide=r=>{
      const now=Date.now(),own=r.owner===me.name;
      const act=u=>u===me.name||now-L(hbk(u),0)<12000;
      const fr=L('tfp_fr_'+me.name,[]).filter(u=>!r.members.includes(u));
      const an=r.members.filter(act).length;
      $('ct').textContent=r.name+' ['+r.region+']';$('bn').textContent=an;
      $('bx').textContent=own&&!r.perm?'çık (siler)':'çık';
      const sig=JSON.stringify([r.members,r.members.map(act),own,fr,armed,r.max]);
      if(sig===last)return;last=sig;
      side.innerHTML='';
      const sec=t=>side.appendChild(el('h4',0,t));
      const row=u=>{const d=el('div','u');d.appendChild(el('span','dot'+(act(u)?' a':'')));
        d.appendChild(bind(el('span','t',u+(u===r.owner?' ♛':'')+(u===me.name?' (sen)':'')),u));
        if(own&&u!==me.name){const b=el('button','btn','✕');b.title='odadan at';b.onclick=()=>kick(u);d.appendChild(b)}return d};
      sec('ETKİN — '+an);r.members.filter(act).forEach(u=>side.appendChild(row(u)));
      const off=r.members.filter(u=>!act(u));
      if(off.length){sec('ÇEVRİMDIŞI — '+off.length);off.forEach(u=>side.appendChild(row(u)))}
      sec('ODA');side.appendChild(el('div','d',r.members.length+'/'+r.max+' kişi · '+(r.perm?'kalıcı':'geçici')+(r.hidden?' · gizli':'')+(r.pw?' · şifreli':'')));
      if(fr.length){sec('ARKADAŞ DAVET ET');fr.forEach(u=>{const d=el('div','u');d.appendChild(el('span','t',u));const b=el('button','btn','davet');b.onclick=()=>invite(u,r);d.appendChild(b);side.appendChild(d)})}
      if(own){sec('YÖNETİM');const b=el('button','btn',armed==='close'?'emin misin? tekrar bas':'odayı kapat');b.onclick=arm;side.appendChild(b)}};
    const poll=()=>{
      const r=R().find(x=>x.id===id);
      if(!r){P('oda kapatıldı.','e');return fin(false)}
      if(!r.members.includes(me.name)){P('odadan çıkarıldın.','e');return fin(false)}
      if(Date.now()-(window._hb||0)>4000){window._hb=Date.now();S(hbk(me.name),Date.now())}
      const near=msgs.scrollHeight-msgs.scrollTop-msgs.clientHeight<80;
      for(;shown<r.msgs.length;shown++)addMsg(r.msgs[shown]);
      if(near)msgs.scrollTop=msgs.scrollHeight;
      drawSide(r)};
    const send=()=>{const t=ci.value.trim();if(!t)return;ci.value='';
      const r=R().find(x=>x.id===id);if(!r)return;
      r.msgs.push({u:me.name,t,ts:Date.now()});upd(r);poll()};
    $('bs').onclick=send;ci.onkeydown=e=>{if(e.key==='Enter')send()};
    $('bm').onclick=()=>side.classList.toggle('open');$('bx').onclick=()=>fin(true);
    iv=setInterval(poll,700);poll();if(innerWidth>700)ci.focus();
  });
}
function upd(room){const rs=R();const i=rs.findIndex(x=>x.id===room.id);if(i>=0){rs[i]=room;saveR(rs)}}
